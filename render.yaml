services:
  - type: web
    name: zad-ai-personal-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
